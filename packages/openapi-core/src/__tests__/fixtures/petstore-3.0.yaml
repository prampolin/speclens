openapi: "3.0.3"
info:
  title: "Petstore API 3.0"
  version: "1.0.0"
  description: "Sample OpenAPI 3.0 Petstore specification"
servers:
  - url: "https://api.petstore.example.com/v1"
    description: "Production server"
paths:
  /pets:
    get:
      operationId: "listPets"
      summary: "List all pets"
      description: "Returns a list of pets with optional filtering"
      tags:
        - "pets"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          description: "How many items to return"
          schema:
            type: "integer"
            format: "int32"
            default: 20
        - name: "status"
          in: "query"
          required: false
          description: "Status filter"
          schema:
            type: "string"
            enum: ["available", "pending", "sold"]
      responses:
        "200":
          description: "A paged array of pets"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Pet"
        "500":
          description: "Unexpected error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "createPet"
      summary: "Create a pet"
      tags:
        - "pets"
      security:
        - ApiKeyAuth: []
      requestBody:
        description: "Pet to add"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: "Null response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: "unexpected error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pets/{petId}:
    parameters:
      - name: "petId"
        in: "path"
        required: true
        description: "The id of the pet to retrieve"
        schema:
          type: "string"
    get:
      operationId: "showPetById"
      summary: "Info for a specific pet"
      tags:
        - "pets"
      responses:
        "200":
          description: "Expected response to a valid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: "deletePet"
      summary: "Deletes a pet"
      tags:
        - "pets"
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: "Pet deleted successfully"

components:
  securitySchemes:
    ApiKeyAuth:
      type: "apiKey"
      in: "header"
      name: "X-API-KEY"
  schemas:
    NewPet:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
        tag:
          type: "string"
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: "object"
          required:
            - "id"
          properties:
            id:
              type: "integer"
              format: "int64"
            status:
              type: "string"
    Error:
      type: "object"
      required:
        - "code"
        - "message"
      properties:
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
