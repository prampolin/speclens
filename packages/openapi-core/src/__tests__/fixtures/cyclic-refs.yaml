openapi: "3.0.0"
info:
  title: "Cyclic Reference API"
  version: "1.0.0"
paths:
  /nodes:
    get:
      summary: "Get tree node"
      operationId: "getNode"
      responses:
        "200":
          description: "Node with recursive children"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
components:
  schemas:
    Node:
      type: "object"
      properties:
        id:
          type: "string"
        parent:
          $ref: "#/components/schemas/Node"
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/Node"
