<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#334155" stroke-width="4" fill="none" opacity="0.4" />

  <!-- Outer Lens Ring -->
  <circle cx="236" cy="236" r="130" stroke="url(#primaryGrad)" stroke-width="28" filter="url(#glow)" />
  <circle cx="236" cy="236" r="130" stroke="url(#primaryGrad)" stroke-width="28" />

  <!-- Lens Handle -->
  <path d="M334 334 L420 420" stroke="url(#primaryGrad)" stroke-width="34" stroke-linecap="round" />

  <!-- Code Symbol Inside Lens (< / >) -->
  <path d="M190 200 L160 236 L190 272" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M282 200 L312 236 L282 272" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="250" y1="195" x2="222" y2="277" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />

  <!-- Sparkle / AI Accent -->
  <path d="M380 120 Q400 120 400 100 Q400 120 420 120 Q400 120 400 140 Q400 120 380 120 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
